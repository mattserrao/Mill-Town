<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mill Town</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand" id="brand">MILL TOWN</div>
      <div id="calendar" class="kpi"></div>
      <i class="sep"></i>
      <div id="cash" class="kpi"></div>
      <div id="profit" class="kpi"></div>
      <div id="population" class="kpi"></div>
      <i class="sep"></i>
      <div id="standing"></div>
      <div class="spacer"></div>
      <button id="trendsBtn" title="Cash, profit, prices, market share, risks and the town over time (T)">Trends</button>
      <button id="soundTop" title="Sound (M)"></button>
      <div id="gameMenu">
        <button id="gameBtn" title="Game menu">☰</button>
        <div id="gameDrop" hidden>
          <button id="saveBtn" title="Save this game under a new name (the game also saves itself every new year)">Save game</button>
          <button id="menuBtn" title="Resume, start or load a game (Esc closes it)">Main menu</button>
          <button id="nextYear" title="Play to next Spring (Shift+Space)">Play to next Spring</button>
          <label class="seed" hidden>Seed <input id="seed" type="text" size="8" /></label>
          <button id="regen" hidden>New town</button>
          <div class="menu-h">Sound</div>
          <label class="vol">Music <input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.6" /></label>
          <label class="vol">Ambience <input type="range" id="ambVol" min="0" max="1" step="0.05" value="0.7" /></label>
          <p class="hint" id="nowPlaying"></p>
          <p class="hint keys">Drag or WASD to pan · scroll or ± to zoom · Space next season · P pause · 1–4 speed · T trends · M sound</p>
          <p class="hint" id="version"></p>
        </div>
      </div>
      <i class="sep"></i>
      <div id="timeControls">
        <span id="speeds" title="Game speed (P pauses; 1–4)">
          <button data-speed="0" title="Pause (P)">❚❚</button><button data-speed="1" title="A season every 13 s">1×</button><button data-speed="2">2×</button><button data-speed="3">4×</button><button data-speed="4">8×</button>
        </span>
        <button id="next" class="primary" title="Next season (Space)">Season ▶</button>
      </div>
    </header>
    <main>
      <div id="viewport">
        <canvas id="view"></canvas>
        <canvas id="minimap" width="256" height="256" title="Click to jump"></canvas>
        <div id="zoom" class="badge"></div>
        <div id="mapTools">
          <button id="layerBtn" title="Map layers and view">Map: <span id="layerName">Town</span> ▾</button>
          <div id="layerMenu" hidden>
            <div id="overlays"></div>
            <div class="ov-group">View</div>
            <div class="chips">
              <label class="chip"><input type="checkbox" id="labels" checked />Names</label>
              <label class="chip"><input type="checkbox" id="grid" />Grid</label>
              <label class="chip"><input type="checkbox" id="animate" checked />Animate</label>
              <select id="tod" title="Time of day"><option value="day">Day</option><option value="cycle">Day &amp; night</option><option value="night">Night</option></select>
            </div>
          </div>
          <div id="legendBox" hidden><div id="legend"></div></div>
        </div>
        <div id="zoomButtons"><button id="zoomIn" title="Zoom in (+)">+</button><button id="zoomOut" title="Zoom out (-)">−</button></div>
        <div id="headline" title="Open the paper"></div>
        <div id="paper" hidden>
          <div class="pp-tabs"><button data-pp="paper" class="on">The paper</button><button data-pp="ledger">Ledger</button><span id="paperNav"></span><button class="pp-close" title="Close (Esc)">✕</button></div>
          <div id="news"></div>
          <ol id="log" hidden></ol>
        </div>
        <div id="final" hidden></div>
        <div id="decision" hidden></div>
        <div id="query" hidden></div>
        <div id="placeBar" hidden></div>
        <div id="trends" hidden></div>
        <div id="menu" hidden></div>
      </div>
      <aside id="right" data-tab="overview">
        <nav id="rightTabs">
          <button data-tab="overview" class="on">Overview</button><button data-tab="works">Works</button><button data-tab="policy">Policy</button><button data-tab="town">Town</button><button data-tab="rivals">Rivals</button>
        </nav>
        <section id="foundSection" data-tab="overview">
          <h2>Found your company</h2>
          <label class="namebox">Industry <select id="industry"></select></label>
          <p class="hint" id="industryNote"></p>
          <label class="namebox">Name <input id="companyName" type="text" maxlength="40" /></label>
          <button id="bestSite" title="Jump to the best-scoring site you can afford (press again for the next)">Show me a good site</button>
          <p class="hint" id="siteHint">Click the map to pick a site.</p>
          <div id="site" class="kv" hidden></div>
          <button id="found" class="primary" disabled>Found company here</button>
          <label class="check"><input type="checkbox" id="placing" checked /> Show the footprint under the cursor</label>
        </section>
        <div id="overview" data-tab="overview"></div>
        <p class="hint tab-empty" data-tab="works" id="worksEmpty">Found a company first.</p>
        <div id="works" data-tab="works"></div>
        <section id="supplySection" data-tab="works" hidden>
          <h2>Supply chain <button id="showSupply" class="link">on the map</button></h2>
          <div id="supply"></div>
        </section>
        <p class="hint tab-empty" data-tab="policy" id="policyEmpty">Found a company first.</p>
        <div id="biz" data-tab="policy"></div>
        <div id="town" data-tab="town"></div>
        <div id="rivalsList" data-tab="rivals"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
